name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      # Only inputs that can change the deployed application.
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'tailwind.config.ts'
      - 'postcss.config.js'
      - 'scripts/precompile-*.ts'
      - '.github/workflows/pages.yml'
      # Tests, documentation, and asset provenance do not need a deployment.
      - '!src/**/*.test.*'
      - '!src/**/*.spec.*'
      - '!src/**/__tests__/**'
      - '!src/**/__mocks__/**'
      - '!src/**/*.md'
      - '!public/**/*.md'
      - '!public/e2e-reset.html'
      - '!public/assets/d2/generated/manifest.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # LFS holds historical test evidence, which the app does not need.
        with:
          lfs: false
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Pages application
        env:
          VITE_BASE_PATH: '${{ steps.pages.outputs.base_path }}/'
          VITE_GITHUB_PAGES: 'true'
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
